name: ci

# Trigger the workflow when:
on:
  # A push occurs to one of the matched branches.
  push:
    branches:
      - master
  # Or when a pull request event occurs, regardless of its base branch (a
  # base-branch filter here would silently skip CI for stacked PRs).
  pull_request:

jobs:

  test:
    # NOTE: This name appears in GitHub's Checks API.
    name: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Lint code
        run: uv run ruff check suffix_trees/
        # Always run this step so that all linting errors can be seen at once.
        if: always()
      - name: Run tests
        run: uv run pytest --cov=suffix_trees
        if: always()
      - name: Generate and run test vectors
        # TODO: could cache the gen_vectors.py result.
        run: |
          uv run python suffix_trees/test/gen_vectors.py
          SUFFIX_TREES_TEST_VECTORS=1 uv run pytest --cov=suffix_trees --cov-append suffix_trees/test/test_vectors.py
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        # Only upload coverage once, from the latest Python version.
        if: success() && matrix.python-version == '3.14'
